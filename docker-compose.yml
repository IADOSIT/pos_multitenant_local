services:
  # ---- Backend API (NestJS) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CACHE_BUST: "20260319-3"
    container_name: pos-iados-api
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      DB_HOST: mysql_local
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: U191tl1ebFN2RJR0fld5QhC8U29AhdOQ
      DB_DATABASE: pos_iados
      JWT_SECRET: iados_jwt_secret_key_production_2024_cambiar
      JWT_EXPIRES_IN: 8h
      FRONTEND_URL: http://localhost,http://localhost:8081,https://posapi.iados.online
      APP_VERSION: "2.2.52"
    volumes:
      - pos_uploads:/app/uploads
    networks:
      - web_network

  # ---- Frontend CMS (React + Vite + Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://posapi.iados.online/api
    container_name: pos-iados-web
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - web_network

volumes:
  pos_uploads:
    driver: local

networks:
  web_network:
    external: true

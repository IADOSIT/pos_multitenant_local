services:
  # ---- Backend API (NestJS) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CACHE_BUST: "20260727-modulo-bascula-autoservicio"
    container_name: pos-iados-api
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      DB_HOST: mysql_local
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: U191tl1ebFN2RJR0fld5QhC8U29AhdOQ
      DB_DATABASE: pos_iados
      JWT_SECRET: iados_jwt_secret_key_production_2024_cambiar
      JWT_EXPIRES_IN: 8h
      FRONTEND_URL: http://localhost,http://localhost:8081,https://pos.iados.online,https://tienda.iados.online
      APP_VERSION: "2.4.1"
      PEXELS_API_KEY: zTTe3zHwLV7IAsqZSwfavWE41iv2ALaGMgrFAtkKitUw1sawGTRSp1wB
      NODE_OPTIONS: "--max-old-space-size=512"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - web_network
      - internet_out
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ---- Shop E-commerce (Next.js 14) ----
  shop:
    build:
      context: ./shop
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://posapi.iados.online/api
    container_name: pos-iados-shop
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://pos-iados-api:3000
      NEXT_PUBLIC_API_URL: https://posapi.iados.online/api
    networks:
      - web_network
      - internet_out
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ---- Frontend CMS (React + Vite + Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CACHE_BUST: "20260727-modulo-bascula-kiosko-config"
    container_name: pos-iados-web
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - web_network

networks:
  web_network:
    external: true
  internet_out:
    driver: bridge

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Assets con cache largo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API al backend — variable fuerza re-resolución DNS Docker
    resolver 127.0.0.11 valid=30s ipv6=off;
    location ^~ /api/ {
        set $upstream pos-iados-api;
        proxy_pass http://$upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        # Reintento automático si backend no está disponible (solo en requests idempotentes)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;
        # Página de error personalizada si backend sigue sin responder
        error_page 502 503 504 @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"statusCode":503,"message":"El servidor está iniciando, espera unos segundos y reintenta"}';
    }
}
